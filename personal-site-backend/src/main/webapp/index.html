<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PersonalSite API Service</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 720px;
            margin: 60px auto;
            padding: 0 20px;
            color: #333;
            line-height: 1.6;
        }
        h1 { color: #2c3e50; }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, monospace;
        }
        .endpoint {
            background: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 0 4px 4px 0;
        }
    </style>
</head>
<body>
    <h1>PersonalSite API Service</h1>
    <p>后端服务运行正常。本服务仅提供 RESTful API，前端请访问 <code>http://localhost:5173</code>。</p>

    <h2>常用接口示例</h2>
    <div class="endpoint">
        <strong>GET</strong> <code>/api/article/list?page=1&size=10</code>
    </div>
    <div class="endpoint">
        <strong>GET</strong> <code>/api/project/list?page=1&size=10</code>
    </div>
    <div class="endpoint">
        <strong>GET</strong> <code>/api/skill/list</code>
    </div>
    <div class="endpoint">
        <strong>GET</strong> <code>/api/config/all</code>
    </div>

    <p>完整接口文档见项目 <code>docs/API.md</code>。</p>
</body>
</html>
