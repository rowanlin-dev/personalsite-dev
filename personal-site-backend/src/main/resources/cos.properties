# 腾讯云 COS 配置
# 实际值从项目根目录的 .env 文件读取
# 本地开发：复制 .env.example 为 .env 并填入真实值
# Tomcat 部署：可将 .env 放到启动目录，或设置同名环境变量

# 敏感配置，从 .env 读取
cos.secretId=${COS_SECRET_ID}
cos.secretKey=${COS_SECRET_KEY}

# 非敏感配置，建议仍从 .env 读取以保持环境一致性
cos.bucket=${COS_BUCKET}
cos.region=${COS_REGION}
cos.domain=${COS_DOMAIN}
cos.publicPrefix=${COS_PUBLIC_PREFIX:public/}
cos.privatePrefix=${COS_PRIVATE_PREFIX:private/}
