# Database configuration
# MySQL 8
# 实际账号密码从项目根目录的 .env 文件读取
# 本地开发：复制 .env.example 为 .env 并填入真实值
# Tomcat 部署：可将 .env 放到启动目录，或设置同名环境变量

jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/personal_site?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
jdbc.username=${JDBC_USERNAME}
jdbc.password=${JDBC_PASSWORD}
jdbc.initialSize=5
jdbc.maxActive=20
